spring:
  datasource:
    url: jdbc:h2:mem:auditdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: audit-service-test
      auto-offset-reset: earliest

app:
  kafka:
    topics:
      claim-submitted: claim-submitted
      claim-validated: claim-validated
      claim-validation-failed: claim-validation-failed
      member-eligible: member-eligible
      member-ineligible: member-ineligible
      claim-fraud-cleared: claim-fraud-cleared
      claim-fraud-flagged: claim-fraud-flagged
      claim-adjudicated: claim-adjudicated
      payment-processed: payment-processed
      claim-notification-sent: claim-notification-sent
