spring:
  datasource:
    url: jdbc:h2:mem:paymentdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service-test
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.debish.health.payment.application.event
        spring.json.value.default.type: com.debish.health.payment.application.event.ClaimAdjudicatedEvent
        spring.json.use.type.headers: false

app:
  kafka:
    topics:
      claim-adjudicated: claim-adjudicated
      payment-processed: payment-processed
