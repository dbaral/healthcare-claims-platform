server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/clinic?createDatabaseIfNotExist=true
    username: clinic
    password: clinicpw
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

cxf:
  path: /services

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  file:
    name: ${LOG_FILE_PATH:../../observability/logs/clinic-soap-service.log}
  pattern:
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
